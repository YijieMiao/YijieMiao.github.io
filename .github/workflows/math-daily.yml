name: Update mathematics papers
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'scripts/update_math_daily.py'
      - 'scripts/check_ai_disclosures.py'
      - 'tests/test_ai_disclosures.py'
      - '.github/workflows/math-daily.yml'
      - 'tests/test_math_daily.py'
permissions:
  contents: write
concurrency:
  group: math-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/update_math_daily.py
      - name: Install PDF text extraction
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Search AI disclosures
        run: python scripts/check_ai_disclosures.py --limit 200
      - name: Commit archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-daily/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update arXiv mathematics archive'
            git push
          fi
