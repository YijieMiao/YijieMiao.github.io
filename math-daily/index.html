<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Math Daily · 自选数学方向的 arXiv 每日论文阅览室">
<title>Math Daily · 数学论文每日速览</title>
<style>body{margin:0;background:#f8f9fd;color:#273344;font:16px/1.8 system-ui,sans-serif}main{max-width:38rem;margin:18vh auto;padding:2rem}a{color:#37638c}</style>
</head>
<body>
<main role="status"><h1>Math Daily</h1><p>正在打开数学阅览室…</p><p id="retry" hidden>暂时无法读取页面，请<a href="">刷新重试</a>。</p></main>
<script>
// Stable public entry point. Reader source stays in the independent repository.
(async () => {
  try {
    const response = await fetch('/math-daily-live/index.html', {cache:'no-cache', signal:AbortSignal.timeout(15000)});
    if (!response.ok) throw new Error('Reader unavailable');
    const html = await response.text();
    if (!html.includes('id="papers"') || !html.includes('app.js')) throw new Error('Invalid reader document');
    const page = html.replace('<head>', '<head><base href="/math-daily-live/">').replace('href="./"', 'href="/math-daily/"');
    document.open();
    document.write(page);
    document.close();
  } catch (error) {
    document.getElementById('retry').hidden = false;
    console.error(error);
  }
})();
</script>
</body>
</html>
